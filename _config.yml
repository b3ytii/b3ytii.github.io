title: Narain Krishna
subtitle: Personal blog and digital garden
description: Notes, projects, and experiments by Narain Krishna.
author: Narain Krishna
language: en
timezone: Asia/Kolkata
url: https://narainkrishna.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

theme: Quieter

source_dir: source
public_dir: public
archive_dir: archives
category_dir: categories
tag_dir: tags
code_dir: downloads/code
i18n_dir: :lang

skip_render:
  - README.md

highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: true

prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ""

post_asset_folder: false
default_layout: post
external_link:
  enable: true
  field: site
  exclude: ""

filename_case: 0
render_drafts: false
relative_link: false
future: false

pretty_urls:
  trailing_index: true
  trailing_html: true

info:
  title: Your Name
  subtitle: Personal blog and digital garden
  author: Your Name
  url: https://narainkrishna.github.io

defaults:
  favicon: /images/favicon.svg
  logo: /images/logo.svg
  avatar: /images/avatar.svg

colors:
  primary: "#8B7CFF"
  secondary: "#2DD4BF"
  default_mode: dark

global:
  content_max_width: 1100px
  sidebar_width: 230px
  hover:
    shadow: true
    scale: false
  scroll_progress:
    bar: true
    percentage: false
  website_counter:
    enable: false
    site_pv: false
    site_uv: false
    post_pv: false
  single_page: true
  preloader:
    enable: false
  open_graph:
    enable: true
    image: /images/og.webp
    description: Notes, projects, and experiments by Your Name.
  google_analytics:
    enable: false

home_banner:
  enable: true
  style: fixed
  image:
    light: /images/banner-light.webp
    dark: /images/banner-dark.webp
  title: Your Name
  subtitle:
    text:
      - Notes, projects, and experiments.
      - A personal blog and digital garden.
    hitokoto:
      enable: false
    typing_speed: 80
    backing_speed: 50
    starting_delay: 400
    backing_delay: 1800
    loop: true
    smart_backspace: true
  text_color:
    light: "#ffffff"
    dark: "#f4f1ff"
  social_links:
    enable: true
    style: default
    links:
      - icon: github
        url: https://github.com/your-username
      - icon: email
        url: mailto:hello@example.com

navbar:
  auto_hide: false
  color:
    left: "#16132b"
    right: "#3d315f"
    transparency: 20
  width:
    home: 1200px
    pages: 1100px
  links:
    Home:
      path: /
      icon: fa-regular fa-house
    Archives:
      path: /archives
      icon: fa-regular fa-box-archive
    About:
      path: /about
      icon: fa-regular fa-user
  search:
    enable: false

home:
  sidebar:
    enable: true
    position: left
    first_item: menu
    announcement: Welcome to my corner of the internet.
    show_on_mobile: true
    links:
      Archives:
        path: /archives
        icon: fa-regular fa-box-archive
      About:
        path: /about
        icon: fa-regular fa-user
  article_date_format: YYYY-MM-DD
  excerpt_length: 200
  categories:
    enable: true
    limit: 3
  tags:
    enable: true
    limit: 3

articles:
  word_count:
    enable: true
    count: true
    min2read: true
  code_block:
    copy: true
    style: mac
    highlight_theme:
      light: github
      dark: tokyo-night-dark
  toc:
    enable: true
    max_depth: 3
    number: false
    expand: true
    init_open: true
  copyright:
    enable: true
    default: all_rights_reserved
  lazyload: true

comment:
  enable: false

footer:
  runtime: false
  statistics: false
  customize: Built with Hexo and Theme Redefine.

plugins:
  feed:
    enable: false

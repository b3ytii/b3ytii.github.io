name: Deploy Hexo site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Hexo site
        run: npm run build

      - name: Validate generated site
        run: |
          test -s public/index.html || { echo '::error::index.html is missing or empty'; exit 1; }
          grep -q '<title>' public/index.html || { echo '::error::index.html has no title'; exit 1; }
          test -s public/sitemap.xml || { echo '::error::sitemap.xml is missing or empty'; exit 1; }
          grep -q '<urlset' public/sitemap.xml || { echo '::error::sitemap.xml is not a valid sitemap'; exit 1; }
          test -s public/404.html || { echo '::error::404.html is missing or empty'; exit 1; }
          POST_COUNT=$(find public -path '*/ctf/*/index.html' | wc -l)
          echo "Post pages generated: $POST_COUNT"
          [ "$POST_COUNT" -ge 40 ] || { echo '::error::expected at least 40 post pages'; exit 1; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
